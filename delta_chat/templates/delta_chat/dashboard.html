<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delta Console</title>
    <style>
        * { box-sizing: border-box; }
        body, html {
            height: 100%; margin: 0; padding: 0;
            background-color: #0f172a; color: #f8fafc;
            font-family: ui-sans-serif, system-ui, sans-serif;
            overflow: hidden;
        }
        .app-container { display: flex; flex-direction: column; height: 100vh; }
        header {
            height: 60px; background: #1e293b; border-bottom: 1px solid #334155;
            display: flex; align-items: center; padding: 0 20px; flex-shrink: 0;
        }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        aside {
            width: 240px; background: #0f172a; border-right: 1px solid #334155;
            padding: 20px; flex-shrink: 0;
        }
        main { display: flex; flex-direction: column; flex: 1; background: #020617; }
        #chat-window {
            flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px;
        }
        .message { display: flex; gap: 15px; max-width: 80%; }
        .avatar {
            width: 32px; height: 32px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0;
        }
        .bubble { background: #1e293b; border: 1px solid #334155; padding: 15px; border-radius: 12px; font-size: 14px; line-height: 1.5; }
        .input-area { background: #1e293b; border-top: 1px solid #334155; padding: 20px; flex-shrink: 0; }
        .input-container { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
        input {
            flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 8px;
            padding: 12px 15px; color: white; outline: none;
        }
        input:focus { border-color: #0284c7; }
        button {
            background: #0284c7; color: white; border: none; padding: 0 25px;
            border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #0ea5e9; }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1 style="color: #38bdf8; font-size: 18px; letter-spacing: 1px;">DELTA_CONSOLE</h1>
        </header>

        <div class="main-content">
            <aside>
                <p style="font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: bold;">System Info</p>
                <p style="font-size: 13px; color: #10b981;">● Wu Active</p>
                <p style="font-size: 11px; color: #64748b; margin-top: 10px;">Operator: Delta</p>
            </aside>

            <main>
                <div id="chat-window">
                    <!-- Initial Message from Wu -->
                    <div class="message">
                        <div class="avatar" style="background: #334155">W</div>
                        <div class="bubble">
                            <p style="font-size: 10px; color: #64748b; margin: 0 0 5px 0; text-transform: uppercase;">Wu</p>
                            Welcome back, <strong>Delta</strong>. Logic Engine initialized. Ready for command.
                        </div>
                    </div>
                </div>

                <div class="input-area">
                    <div class="input-container">
                        <input type="text" id="user-input" placeholder="Enter logic query...">
                        <button id="send-btn">SEND</button>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const chatWindow = document.getElementById('chat-window');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';

            // Delta (You) = Sky Blue | Wu (System) = Slate
            const color = (role === 'Delta') ? '#0284c7' : '#334155';

            msgDiv.innerHTML = `
                <div class="avatar" style="background: ${color}">
                    ${role[0]}
                </div>
                <div class="bubble">
                    <p style="font-size: 10px; color: #64748b; margin: 0 0 5px 0; text-transform: uppercase;">${role}</p>
                    ${text}
                </div>
            `;
            chatWindow.appendChild(msgDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const text = userInput.value;
            if (!text) return;

            appendMessage('Delta', text); // You are Delta
            userInput.value = '';

            // This is the call to our actual Django API
            const formData = new FormData();
            formData.append('text', text);

            try {
                const response = await fetch('/delta/api/', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                appendMessage('Wu', data.reply); // The system is Wu
            } catch (e) {
                appendMessage('Wu', 'ERROR: Communication with Neon Cloud severed.');
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>

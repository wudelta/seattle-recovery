{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Console | Wu Architect</title>
    <link rel="stylesheet" href="{% static 'delta_chat/css/styles.css' %}">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="header-title">HopeHub</h1>
        </header>
        <div class="main-content">
            <aside>
                <div class="system-status">
                    <p class="stat-label">System Status</p>
                    <p id="system-status" class="status-active">Initializing...</p>
                </div>
                
                <!-- Hooked Target: Active Brain Display Node -->
                <div class="active-brain">
                    <p class="stat-label">Active Brain</p>
                    <p id="active-brain" class="model-val" style="transition: color 0.3s ease;">Architect (70B)</p>
                </div>
                
                <!-- Hooked Target: Groq Token Fuel Visual Gauge Component -->
                <div class="token-fuel">
                    <p class="stat-label">Groq Token Fuel</p>
                    <div class="gauge-container" style="background: #222; width: 100%; height: 10px; border-radius: 4px; overflow: hidden; border: 1px solid #444; margin-top: 5px;">
                        <!-- Inner slider element responds to real-time API values -->
                        <div id="token-gauge" style="background: #00ffff; width: 100%; height: 100%; transition: width 0.4s ease, background-color 0.4s ease;"></div>
                    </div>
                    <!-- Hooked Target: Numeric Fuel Tracker String Value -->
                    <p id="token-count-display" class="stat-value" style="margin-top: 5px; font-size: 12px; color: #00ffff;">-- / --</p>
                </div>
                
                <div class="operator-info">
                    <p class="stat-label">Operator</p>
                    <p class="operator-name">Delta</p>
                </div>
                
                <div class="session-control">
                    <p class="stat-label">Session Control</p>
                    <button id="end-session-btn" class="btn-danger">CLOSE SESSION</button>
                    <p id="session-stats" class="session-log"></p>
                </div>
                
                <div class="manual-log">
                    <p class="stat-label">Manual Log</p>
                    <input type="number" id="manual-hours" placeholder="Hrs" style="width: 50px; font-size: 10px; padding: 4px;">
                    <input type="text" id="manual-note" placeholder="Task..." style="width: 100px; font-size: 10px; padding: 4px;">
                    <button onclick="logManualTime()" style="background: #38bdf8; font-size: 10px; padding: 5px;">ADD</button>
                </div>
            </aside>
            
            <main>
                <div id="chat-window">
                  <pre id="response-output">{{ response_output }}</pre>
                  <button class="copy-button" id="copy-button"></button>
                </div>
                <div class="input-area">
                    <div class="input-container">
                        <!-- Matches your exact input tag parameters -->
                        <textarea id="user-input" placeholder="Enter instruction or paste JSON..." autocomplete="off" rows="1"></textarea>
                        <button id="send-btn">SEND</button>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script src="{% static 'delta_chat/js/script.js' %}"></script>
</body>
</html>

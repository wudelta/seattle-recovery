# ======================================================================
# FILE: webserver/default.conf (PATCH 1 OF 1)
# START: UNIFIED_ASGI_NGINX_ROUTING_RULES
# ======================================================================
server {
    listen 3000;
    server_name localhost;

    # Set maximum upload size cap allocation
    client_max_body_size 50M;

    # 1. SERVE STATIC FILES: Nginx handles these instantly from the shared volume
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 2. HANDLE WEBSOCKET TELEMETRY STREAMS: Explicit HTTP Upgrade Header Forwarding
    # Route Aurora WebSockets to the builder container node
    location /ws/aurora/ {
        proxy_pass http://seattle_django_aurora:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Route HopeHub WebSockets to the production clinical container node
    location /ws/hopehub/ {
        proxy_pass http://seattle_django_hopehub:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 3. ROUTE VIEWS & POST PAYLOADS: Split paths to individual application containers
    # Route Aurora traffic
    location /aurora/ {
        proxy_pass http://seattle_django_aurora:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route HopeHub traffic
    location /hopehub/ {
        proxy_pass http://seattle_django_hopehub:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Route the administrative dashboard dynamically using the Referer mapping headers
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        if ($http_referer ~* /hopehub/) {
            proxy_pass http://seattle_django_hopehub:8000;
        }
        if ($http_referer ~* /aurora/) {
            proxy_pass http://seattle_django_aurora:8000;
        }
        
        # Fallback path if hitting /admin/ cleanly from scratch
        proxy_pass http://seattle_django_aurora:8000;
    }
}
# ======================================================================
# END: UNIFIED_ASGI_NGINX_ROUTING_RULES (PATCH 1 OF 1)
# ======================================================================

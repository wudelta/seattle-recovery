# ======================================================================
# FILE: webserver/default.conf (PATCH 1 OF 1)
# START: UNIFIED_ASGI_NGINX_ROUTING_RULES
# ======================================================================
server {
    listen 3000;
    server_name localhost;

    # Set maximum upload size cap allocation
    client_max_body_size 50M;

    # 1. SERVE STATIC FILES: Nginx handles these instantly from the shared volume
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    # 2. HANDLE WEBSOCKET TELEMETRY STREAMS: Explicit HTTP Upgrade Header Forwarding
    location /ws/ {
        proxy_pass http://django_app:8000;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Prevent Nginx from closing long-lived idle streaming loops
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 3. ROUTE VIEWS & POST PAYLOADS: Direct link down to the Daphne ASGI server
    location / {
        proxy_pass http://django_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# ======================================================================
# END: UNIFIED_ASGI_NGINX_ROUTING_RULES (PATCH 1 OF 1)
# ======================================================================

# ====================================================================== #
[pytest]
DJANGO_SETTINGS_MODULE = core_logic.settings
python_files = test_*.py

# Hardened warning filter matrix to discard legacy neo4j driver noise completely
filterwarnings =
    ignore::UserWarning:neomodel.*
    ignore::DeprecationWarning:neomodel.*
    ignore::DeprecationWarning:django_neomodel.*
    ignore::DeprecationWarning:neo4j.*
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:urllib3.*
    ignore::RuntimeWarning:django.*

# Native async handlers for pytest-asyncio environment execution
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# ====================================================================== #
# END: PYTEST_ASYNCIO_CONFIGURATION_MATRIX                               #
# ====================================================================== #

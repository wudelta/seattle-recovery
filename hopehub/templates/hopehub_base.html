{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HopeHub{% endblock %}</title>
    
    <!-- Link strictly to your new custom HopeHub theme -->
    <link rel="stylesheet" href="{% static 'css/hopehub.bootstrap.min.css' %}">
</head>
<body>

    <header class="container mt-4">
        <!-- Main Application Header (Now properly visible in the body) -->
        <h1 class="h2 text-dark font-weight-bold mb-3">HopeHub</h1>

        <!-- This placeholder lets child templates inject their own unique menus -->
        {% block navigation %}{% endblock %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="container mt-5 py-3 border-top text-muted">
        <p>&copy; 2026 HopeHub</p>
    </footer>

    <!-- Local JavaScript Assets -->
    <script src="{% static 'js/jquery-3.2.1.slim.min.js' %}"></script>
    <script src="{% static 'js/bootstrap.min.js' %}"></script>
</body>
</html>

<div class='container mt-4'>
  <div class='card shadow-sm'>
    <div class='card-header bg-primary text-white'>
      <h5 class='mb-0'>Live Stream Data: get_content</h5>
    </div>
    <div class='card-body'>
      <pre id='json_payload_render' class='bg-light p-3 border rounded'>Loading payload stream...</pre>
    </div>
  </div>
</div>
<script>
  // Absolute fetch URL strategy to avoid browser scope path confusion
  document.addEventListener('DOMContentLoaded', function() {
    fetch('/hopehub/api/get_content/')
      .then(response => {
        if (!response.ok) throw new Error('Network stream error');
        return response.json();
      })
      .then(data => {
        document.getElementById('json_payload_render').textContent = JSON.stringify(data, null, 2);
      })
      .catch(err => {
        document.getElementById('json_payload_render').innerHTML = '<span class="text-danger">Failed to retrieve streaming payload resource.</span>';
      });
  });
</script>

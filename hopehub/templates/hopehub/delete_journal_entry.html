{% extends 'hopehub_base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            
            <!-- Alert/Warning Themed Card -->
            <div class="card shadow-sm border-0">
                
                <!-- Red top border to signal danger/warning -->
                <div class="card-header bg-danger" style="height: 6px; padding: 0;"></div>
                
                <div class="card-body p-4 p-md-5 text-center">
                    
                    <!-- Warning Icon Symbol -->
                    <div class="text-danger mb-3">
                        <svg xmlns="http://w3.org" width="48" height="48" fill="currentColor" class="bi bi-exclamation-triangle" viewBox="0 0 16 16">
                            <path d="M7.938 2.016A.13.13 0 0 1 8.002 2a.13.13 0 0 1 .063.016.15.15 0 0 1 .054.057l6.857 11.667c.036.06.035.124.002.183a.2.2 0 0 1-.054.06.1.1 0 0 1-.066.017H1.146a.1.1 0 0 1-.066-.017.2.2 0 0 1-.054-.06.18.18 0 0 1 .002-.183L7.884 2.073a.15.15 0 0 1 .054-.057zm1.044-.45a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767z"/>
                            <path d="M7.002 12a1 1 0 1 1 2 0 1 1 0 0 1-2 0zM7.1 5.995a.905.905 0 1 1 1.8 0l-.35 3.507a.552.552 0 0 1-1.1 0z"/>
                        </svg>
                    </div>

                    <h1 class="h4 font-weight-bold text-dark mb-2">Delete Journal Entry</h1>
                    <p class="text-muted mb-4">
                        Are you sure you want to delete this journal entry? This action is permanent and cannot be undone.
                    </p>
                    
                    <!-- Form actions split evenly -->
                    <form method="post" class="mt-4">
                        {% csrf_token %}
                        
                        <div class="d-flex justify-content-center align-items-center">
                            <!-- Safe Cancel Link -->
                            <a href="{% url 'hopehub:journal_entries' %}" class="btn btn-light border px-4 mr-3 font-weight-bold">
                                No, Keep It
                            </a>
                            
                            <!-- Destructive Delete Confirmation Button -->
                            <button type="submit" class="btn btn-danger px-4 font-weight-bold shadow-sm">
                                Yes, Delete
                            </button>
                        </div>
                    </form>

                </div>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}

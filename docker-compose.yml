# ======================================================================
# FILE: docker-compose.yml (PATCH 1 OF 1)
# START: DOCKER_COMPOSE_CORE_BLUEPRINT
# ======================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: seattle_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    command: [ "postgres", "-c", "shared_buffers=256MB", "-c", "effective_cache_size=768MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=64MB" ]
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        reservations:
          memory: 128M
        limits:
          cpus: '0.50'
          memory: 1024M
    networks:
      - recovery_net

  neo4j:
    image: neo4j:5.12-community
    container_name: seattle_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        reservations:
          memory: 256M
        limits:
          cpus: '0.50'
          memory: 1024M
    networks:
      - recovery_net

  redis_broker:
    image: redis:7-alpine
    container_name: seattle_redis
    command: redis-server --bind 0.0.0.0 --protected-mode no
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - recovery_net
    restart: always

  # Isolated Runtime Layer: Aurora App Builder
  django_aurora:
    build: .
    container_name: seattle_django_aurora
    user: "root"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Fix: Point straight to your actual monolithic master settings file
      - DJANGO_SETTINGS_MODULE=core_logic.settings
      - DB_NAME=aurora_db
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - neo4j
      - redis_broker
      - python_sandbox_cache
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M
    networks:
      - recovery_net

  # Isolated Runtime Layer: Hopehub Application (Cloud Candidate)
  django_hopehub:
    build: .
    container_name: seattle_django_hopehub
    user: "root"
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      # Fix: Point straight to your actual monolithic master settings file
      - DJANGO_SETTINGS_MODULE=core_logic.settings
      - DB_NAME=hopehub_db
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - neo4j
      - redis_broker
      - python_sandbox_cache
    deploy:
      resources:
        limits:
          cpus: '0.40'
          memory: 512M
    networks:
      - recovery_net
      
  web_server:
    build: ./webserver
    container_name: seattle_web
    ports:
      - "3000:3000"
    volumes:
      - static_volume:/app/staticfiles:ro
      # Fix: Forcefully mount your updated config file directly over Nginx's internal fallback config
      - ./webserver/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django_aurora
      - django_hopehub
    networks:
      - recovery_net

  python_sandbox_cache:
    image: python:3.11-slim
    restart: "no"
    entrypoint: ["echo", "[SYSTEM_CACHE] python:3.11-slim worker base initialized successfully"]
    networks:
      - recovery_net

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  static_volume:

networks:
  recovery_net:
    driver: bridge
# ======================================================================
# END: DOCKER_COMPOSE_CORE_BLUEPRINT (PATCH 1 OF 1)
# ======================================================================

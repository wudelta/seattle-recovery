<!-- ====================================================================== -->
<!-- FILE: aurora/templates/aurora/planning/workspace.html -->
<!-- START: PLANNING_WORKSPACE_STATES -->
<!-- ====================================================================== -->
<div
    id="planning-workspace"
    class="planning-workspace-shell flex-grow-1 d-flex overflow-hidden"
    style="min-height: 0;"
>
    <aside
        id="planning-navigator"
        class="planning-navigator d-flex flex-column flex-shrink-0 border-end border-secondary"
        aria-label="Decision Engine navigator"
    >
        <header
            class="planning-navigator-header d-flex align-items-center justify-content-between gap-2 px-2 py-2 border-bottom border-secondary"
        >
            <div class="small text-uppercase text-muted fw-bold">
                Initiatives
            </div>

            <button
                id="planning-create-initiative-btn"
                type="button"
                class="btn btn-sm btn-outline-success"
                aria-label="Create Initiative"
                title="Create Initiative"
                disabled
            >
                +
            </button>
        </header>

        <div
            class="planning-navigator-body flex-grow-1 overflow-auto"
            style="min-height: 0;"
        >
            <section class="planning-navigator-section">
                <div
                    class="d-flex align-items-center justify-content-between gap-2"
                >
                    <div class="planning-navigator-section-label">
                        Project
                    </div>

                    <button
                        id="planning-edit-project-btn"
                        type="button"
                        class="btn btn-sm btn-outline-primary"
                        aria-label="Edit Project"
                        title="Edit Project"
                        disabled
                    >
                        Edit
                    </button>
                </div>

                <button
                    id="planning-navigator-project"
                    type="button"
                    class="planning-navigator-item planning-navigator-project text-start"
                    disabled
                >
                    <span class="planning-navigator-marker"></span>

                    <span class="planning-navigator-item-body">
                        <span
                            id="planning-navigator-project-title"
                            class="planning-navigator-item-title"
                        >
                            Loading project...
                        </span>

                        <span
                            id="planning-navigator-project-meta"
                            class="planning-navigator-item-meta"
                        >
                            Waiting for persisted context
                        </span>
                    </span>
                </button>
            </section>

            <section class="planning-navigator-section">
                <div
                    id="planning-navigator-initiative-list"
                    class="planning-navigator-list"
                >
                    <div class="planning-navigator-placeholder">
                        Select a Project to view Initiatives.
                    </div>
                </div>
            </section>
        </div>
    </aside>

    <main
        id="planning-workbench"
        class="planning-workbench flex-grow-1 d-flex flex-column overflow-hidden"
        style="min-width: 0; min-height: 0;"
    >
        <header
            id="planning-workbench-header"
            class="planning-workbench-header flex-shrink-0 border-bottom border-secondary px-3 py-2"
        >
            <div class="d-flex align-items-center gap-3">
                <div
                    id="planning-workbench-title"
                    class="planning-workbench-title flex-grow-1 text-truncate"
                >
                    Decision Engine
                </div>

                <div
                    id="planning-workbench-context"
                    class="planning-workbench-context small text-muted text-truncate"
                >
                    Select an Initiative to begin.
                </div>

                <div
                    id="planning-workbench-status"
                    class="planning-workbench-status flex-shrink-0"
                ></div>
            </div>
        </header>

        <div
            id="planning-workbench-content"
            class="planning-workbench-content flex-grow-1 overflow-auto p-3"
            style="min-height: 0;"
        >
            <div
                id="planning-loading-state"
                class="d-none h-100 align-items-center justify-content-center text-center"
            >
                <div>
                    <div
                        class="spinner-border text-info mb-3"
                        role="status"
                        aria-hidden="true"
                    ></div>

                    <div class="text-muted">
                        Loading Decision Engine records...
                    </div>
                </div>
            </div>

            <div
                id="planning-error-state"
                class="d-none alert alert-danger"
                role="alert"
            >
                <div class="fw-bold mb-1">
                    Planning data could not be loaded.
                </div>

                <div id="planning-error-message">
                    An unexpected error occurred.
                </div>
            </div>

            <div
                id="planning-empty-state"
                class="d-none h-100 align-items-center justify-content-center text-center"
            >
                <div class="border border-secondary rounded p-4 bg-dark">
                    <div class="fs-5 fw-bold mb-2">
                        No initiatives exist
                    </div>

                    <div class="text-muted mb-1">
                        The selected Project has no persisted initiatives.
                    </div>

                    <div
                        id="planning-empty-project-name"
                        class="text-info fw-bold mb-3"
                    ></div>

                    <button
                        id="planning-empty-create-initiative-btn"
                        type="button"
                        class="btn btn-sm btn-outline-success"
                        disabled
                    >
                        New Initiative
                    </button>
                </div>
            </div>

            <div
                id="planning-initiative-list"
                class="d-flex flex-column gap-3"
            ></div>
        </div>
    </main>
</div>
<!-- ====================================================================== -->
<!-- END: PLANNING_WORKSPACE_STATES -->
<!-- ====================================================================== -->

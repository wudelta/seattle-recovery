<!-- ====================================================================== -->
<!-- FILE: aurora/templates/aurora/planning/forms/phase_form.html -->
<!-- START: PHASE_FORM -->
<!-- ====================================================================== -->
<div
    class="planning-phase-form-panel d-none planning-rule"
>
    <form
        class="planning-phase-form p-3"
        data-phase-id=""
    >
        <div
            class="d-flex justify-content-between align-items-center mb-3"
        >
            <div>
                <div
                    class="planning-phase-form-heading fw-bold text-light"
                >
                    Create Phase
                </div>

                <div
                    class="planning-phase-form-guidance small text-muted"
                >
                    Add an ordered milestone to this Initiative.
                </div>
            </div>

            <button
                type="button"
                class="planning-cancel-phase-btn btn btn-sm btn-outline-secondary"
            >
                Cancel
            </button>
        </div>

        <div
            class="planning-phase-form-error d-none alert alert-danger py-2"
            role="alert"
        ></div>

        <div class="row g-3">
            <div class="col-12 col-lg-6">
                <label class="form-label small text-light">
                    Title
                </label>

                <input
                    name="title"
                    type="text"
                    class="planning-phase-form-title form-control form-control-sm bg-black text-light border-secondary"
                    maxlength="255"
                    required
                >
            </div>

            <div class="col-12 col-lg-3">
                <label class="form-label small text-light">
                    Assigned To
                </label>

                <select
                    name="assigned_to_id"
                    class="planning-phase-form-assigned-to form-select form-select-sm bg-black text-light border-secondary"
                    required
                >
                    <option value="">
                        Select an assignee
                    </option>
                </select>
            </div>

            <div class="col-12 col-lg-3">
                <label class="form-label small text-light">
                    Status
                </label>

                <select
                    name="status"
                    class="planning-phase-form-status form-select form-select-sm bg-black text-light border-secondary"
                >
                    <option value="PLANNED">
                        Planned
                    </option>
                    <option value="ACTIVE">Active</option>
                    <option value="PAUSED">Paused</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>

            <div class="col-12">
                <label class="form-label small text-light">
                    Description
                </label>

                <textarea
                    name="description"
                    class="planning-phase-form-description form-control form-control-sm bg-black text-light border-secondary"
                    rows="3"
                    placeholder="Describe the milestone, intended result, and boundaries."
                ></textarea>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-3">
            <button
                type="reset"
                class="btn btn-sm btn-outline-secondary"
            >
                Clear
            </button>

            <button
                type="submit"
                class="planning-save-phase-btn btn btn-sm btn-success"
            >
                Save Phase
            </button>
        </div>
    </form>
</div>
<!-- ====================================================================== -->
<!-- END: PHASE_FORM -->
<!-- ====================================================================== -->

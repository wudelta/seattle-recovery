<template id="planning-phase-template">
    <section class="planning-phase">
        <header class="planning-phase-header">
            <div
                class="d-flex justify-content-between align-items-start gap-3"
            >
                <button
                    type="button"
                    class="planning-toggle-phase-btn planning-phase-toggle flex-grow-1 min-w-0 text-start"
                    aria-expanded="true"
                    aria-label="Collapse Phase"
                    title="Collapse Phase"
                >
                    <div
                        class="d-flex justify-content-between align-items-start gap-3"
                    >
                        <div class="flex-grow-1 min-w-0">
                            <div
                                class="d-flex align-items-center gap-2 flex-wrap"
                            >
                                <span
                                    class="planning-phase-toggle-icon"
                                    aria-hidden="true"
                                >
                                    ▾
                                </span>

                                <span
                                    class="planning-phase-position planning-muted small"
                                ></span>

                                <h3
                                    class="planning-phase-title mb-0"
                                ></h3>

                                <span
                                    class="planning-phase-status badge"
                                ></span>

                                <span
                                    class="planning-phase-summary planning-muted small"
                                ></span>
                            </div>

                            <p
                                class="planning-phase-description planning-muted mt-2 mb-0"
                            ></p>
                        </div>

                        <div
                            class="planning-phase-progress flex-shrink-0 text-end"
                        >
                            <div
                                class="planning-phase-progress-label planning-muted small"
                            ></div>

                            <div
                                class="planning-phase-progress-track"
                                role="progressbar"
                                aria-valuemin="0"
                                aria-valuemax="100"
                                aria-valuenow="0"
                            >
                                <div
                                    class="planning-phase-progress-value"
                                ></div>
                            </div>
                        </div>
                    </div>
                </button>

                <div
                    class="planning-header-actions d-flex align-items-center gap-1 flex-shrink-0"
                >
                    <button
                        type="button"
                        class="planning-edit-phase-btn planning-icon-btn planning-edit-action"
                        aria-label="Edit Phase"
                        title="Edit Phase"
                    >
                        <span aria-hidden="true">✎</span>
                    </button>

                    <button
                        type="button"
                        class="planning-new-step-btn planning-icon-btn planning-create-action"
                        aria-label="Create Step"
                        title="Create Step"
                    >
                        <span aria-hidden="true">+</span>
                    </button>

                    <button
                        type="button"
                        class="planning-delete-phase-btn planning-icon-btn planning-delete-action"
                        aria-label="Delete Phase"
                        title="Delete Phase"
                    >
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="planning-phase-body">
            {% include "aurora/planning/forms/step_form.html" %}

            <div class="planning-step-list"></div>
        </div>
    </section>
</template>
<!-- ====================================================================== -->
<!-- END: PHASE_TEMPLATE -->
<!-- ====================================================================== -->

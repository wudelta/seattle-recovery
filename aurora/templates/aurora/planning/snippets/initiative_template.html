<template id="planning-initiative-template">
    <article class="planning-initiative planning-paper">
        <header class="planning-section planning-initiative-header">
            <div
                class="d-flex justify-content-between align-items-start gap-3"
            >
                <div class="flex-grow-1 min-w-0">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <h2
                            class="planning-initiative-title mb-0"
                        ></h2>

                        <span
                            class="planning-initiative-status badge"
                        ></span>
                    </div>

                    <div
                        class="planning-initiative-meta planning-muted small d-flex align-items-center gap-2 flex-wrap mt-1"
                    >
                        <span class="planning-initiative-owner"></span>
                        <span
                            class="planning-initiative-meta-separator"
                            aria-hidden="true"
                        >
                            ·
                        </span>
                        <span class="planning-initiative-updated"></span>
                    </div>

                    <p
                        class="planning-initiative-description planning-text mt-2 mb-0"
                    ></p>
                </div>

                <div
                    class="planning-header-actions d-flex align-items-center gap-1 flex-shrink-0"
                >
                    <button
                        type="button"
                        class="planning-edit-initiative-btn planning-icon-btn planning-edit-action"
                        aria-label="Edit Initiative"
                        title="Edit Initiative"
                    >
                        <span aria-hidden="true">✎</span>
                    </button>

                    <button
                        type="button"
                        class="planning-new-phase-btn planning-icon-btn planning-create-action"
                        aria-label="Create Phase"
                        title="Create Phase"
                    >
                        <span aria-hidden="true">+</span>
                    </button>

                    <button
                        type="button"
                        class="planning-delete-initiative-btn planning-icon-btn planning-delete-action"
                        aria-label="Delete Initiative"
                        title="Delete Initiative"
                    >
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
            </div>
        </header>

        {% include "aurora/planning/forms/phase_form.html" %}

        <div
            class="planning-phase-list d-flex flex-column"
        ></div>
    </article>
</template>
<!-- ====================================================================== -->
<!-- END: INITIATIVE_TEMPLATE -->
<!-- ====================================================================== -->

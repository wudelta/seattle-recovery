<!-- ====================================================================== -->
<!-- FILE: aurora/templates/aurora/planning/project_form.html -->
<!-- START: PROJECT_CREATION_FORM -->
<!-- ====================================================================== -->
<div
    id="planning-project-form-panel"
    class="d-none flex-shrink-0 border-bottom border-secondary bg-dark"
>
    <form id="planning-project-form" class="p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <div
                    id="planning-project-form-heading"
                    class="fw-bold text-light"
                >
                    Create Project
                </div>

                <div
                    id="planning-project-form-guidance"
                    class="small text-muted"
                >
                    Create a product, application, or engineering domain.
                </div>
            </div>

            <button
                id="planning-cancel-project-btn"
                type="button"
                class="btn btn-sm btn-outline-secondary"
            >
                Cancel
            </button>
        </div>

        <div
            id="planning-project-form-error"
            class="d-none alert alert-danger py-2"
            role="alert"
        ></div>

        <div class="row g-3">
            <div class="col-12 col-lg-8">
                <label
                    for="planning-project-title"
                    class="form-label small text-light"
                >
                    Title
                </label>

                <input
                    id="planning-project-title"
                    name="title"
                    type="text"
                    class="form-control form-control-sm bg-black text-light border-secondary"
                    maxlength="255"
                    required
                >
            </div>

            <div class="col-12 col-sm-6 col-lg-2">
                <label
                    for="planning-project-color"
                    class="form-label small text-light"
                >
                    Color
                </label>

                <input
                    id="planning-project-color"
                    name="color"
                    type="text"
                    class="form-control form-control-sm bg-black text-light border-secondary"
                    maxlength="50"
                    placeholder="Optional"
                >
            </div>

            <div class="col-12 col-sm-6 col-lg-2">
                <label
                    for="planning-project-icon"
                    class="form-label small text-light"
                >
                    Icon
                </label>

                <input
                    id="planning-project-icon"
                    name="icon"
                    type="text"
                    class="form-control form-control-sm bg-black text-light border-secondary"
                    maxlength="100"
                    placeholder="Optional"
                >
            </div>

            <div class="col-12 col-md-6">
                <label
                    for="planning-project-status"
                    class="form-label small text-light"
                >
                    Status
                </label>

                <select
                    id="planning-project-status"
                    name="status"
                    class="form-select form-select-sm bg-black text-light border-secondary"
                    required
                >
                    <option value="PLANNED">Planned</option>
                    <option value="ACTIVE">Active</option>
                    <option value="PAUSED">Paused</option>
                    <option value="COMPLETED">Completed</option>
                    <option value="CANCELLED">Cancelled</option>
                </select>
            </div>

            <div class="col-12 col-md-6">
                <label
                    for="planning-project-assigned-to"
                    class="form-label small text-light"
                >
                    Assigned To
                </label>

                <select
                    id="planning-project-assigned-to"
                    name="assigned_to_id"
                    class="form-select form-select-sm bg-black text-light border-secondary"
                    required
                >
                    <option value="">Select a user</option>
                </select>
            </div>

            <div
                id="planning-project-created-by-field"
                class="col-12 col-md-6 d-none"
            >
                <label
                    for="planning-project-created-by"
                    class="form-label small text-light"
                >
                    Created By
                </label>

                <input
                    id="planning-project-created-by"
                    name="created_by_name"
                    type="text"
                    class="form-control form-control-sm bg-black text-muted border-secondary"
                    readonly
                    aria-readonly="true"
                >
            </div>

            <div class="col-12">
                <label
                    for="planning-project-description"
                    class="form-label small text-light"
                >
                    Description
                </label>

                <textarea
                    id="planning-project-description"
                    name="description"
                    class="form-control form-control-sm bg-black text-light border-secondary"
                    rows="4"
                    placeholder="Describe the Project's purpose, boundaries, and expected outcomes."
                ></textarea>
            </div>

            <div class="col-12">
                <div class="form-check">
                    <input
                        id="planning-project-active"
                        name="active"
                        type="checkbox"
                        class="form-check-input"
                        checked
                    >

                    <label
                        for="planning-project-active"
                        class="form-check-label small text-light"
                    >
                        Available in Planning
                    </label>
                </div>

                <div class="small text-muted mt-1">
                    This controls whether the Project appears in normal
                    planning navigation. Lifecycle state is managed separately
                    through Status.
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between gap-2 mt-3">
            <button
                id="planning-delete-project-btn"
                type="button"
                class="btn btn-sm btn-outline-danger d-none"
            >
                Delete Project
            </button>

            <div class="d-flex gap-2 ms-auto">
                <button
                    type="reset"
                    class="btn btn-sm btn-outline-secondary"
                >
                    Clear
                </button>

                <button
                    id="planning-save-project-btn"
                    type="submit"
                    class="btn btn-sm btn-success"
                >
                    Save Project
                </button>
            </div>
        </div>
    </form>
</div>
<!-- ====================================================================== -->
<!-- END: PROJECT_CREATION_FORM -->
<!-- ====================================================================== -->

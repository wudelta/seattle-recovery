<!-- FILE: aurora/templates/aurora/planning/step_template.html -->
<!-- START: STEP_TEMPLATE -->
<!-- ====================================================================== -->
<template id="planning-step-template">
    <div class="planning-step">
        <div class="planning-step-position"></div>

        <div class="planning-step-body">
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <h4
                    class="planning-step-title mb-0"
                ></h4>

                <span class="planning-step-status badge"></span>

                <span
                    class="planning-step-estimate badge bg-black text-info border border-secondary"
                ></span>
            </div>

            <p
                class="planning-step-description planning-text mt-2 mb-1"
            ></p>

            <div
                class="planning-step-validation small mt-2"
            >
                <span class="text-warning fw-bold">
                    Validation:
                </span>

                <span
                    class="planning-step-validation-description planning-muted"
                ></span>
            </div>

            <div
                class="planning-step-validation-result small mt-1 d-none"
            >
                <span class="text-success fw-bold">
                    Evidence:
                </span>

                <span
                    class="planning-step-validation-notes planning-muted"
                ></span>
            </div>
        </div>

        <div class="planning-step-meta planning-muted small text-end">
            <div class="d-flex flex-column gap-2 mb-2">
                <button
                    type="button"
                    class="planning-edit-step-btn btn btn-outline-secondary btn-sm"
                >
                    Edit Step
                </button>

                <button
                    type="button"
                    class="planning-delete-step-btn btn btn-outline-danger btn-sm"
                >
                    Delete Step
                </button>
            </div>

            <div class="planning-step-validator"></div>
            <div class="planning-step-updated"></div>
        </div>
    </div>
</template>
<!-- ====================================================================== -->
<!-- END: STEP_TEMPLATE -->
<!-- ====================================================================== -->

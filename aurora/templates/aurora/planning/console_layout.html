<!-- FILE: aurora/templates/aurora/planning/console_layout.html -->
<!-- START: PLANNING_CONSOLE_LAYOUT -->
<!-- ====================================================================== -->
<div
    id="planning-console-panel"
    class="planning-workspace h-100 w-100 d-flex flex-column bg-black text-light"
    style="min-height: 0;"
>
    <div
        class="planning-toolbar d-flex align-items-center gap-3 px-3 py-2 border-bottom border-secondary flex-shrink-0"
    >
        <div
            class="text-uppercase fw-bold flex-shrink-0"
            style="letter-spacing: 1px;"
        >
            Decision Engine
        </div>

        <div
            class="planning-project-controls d-flex align-items-center gap-2 flex-grow-1"
        >
            <label
                for="planning-project-select"
                class="visually-hidden"
            >
                Active Project
            </label>

            <select
                id="planning-project-select"
                class="planning-project-select form-select bg-black text-light border-secondary"
                aria-label="Active planning project"
            >
                <option value="">
                    Loading projects...
                </option>
            </select>

            <button
                id="planning-edit-project-btn"
                type="button"
                class="planning-icon-btn planning-edit-action flex-shrink-0"
                aria-label="Edit Project"
                title="Edit Project"
                disabled
            >
                <span aria-hidden="true">✎</span>
            </button>

            <button
                id="planning-create-project-btn"
                type="button"
                class="planning-icon-btn planning-create-action flex-shrink-0"
                aria-label="Create Project"
                title="Create Project"
            >
                <span aria-hidden="true">+</span>
            </button>
        </div>

        <div
            class="planning-toolbar-summary d-flex align-items-center gap-2 ms-auto flex-shrink-0"
        >
            <span
                id="planning-summary-badge"
                class="badge bg-dark border border-secondary text-info"
            >
                Not loaded
            </span>

            <button
                id="planning-refresh-btn"
                type="button"
                class="btn btn-sm btn-outline-info"
            >
                Refresh
            </button>
        </div>
    </div>

    {% include "aurora/planning/forms/project_form.html" %}

    {% include "aurora/planning/forms/initiative_form.html" %}

    {% include "aurora/planning/workspace.html" %}
</div>
<!-- ====================================================================== -->
<!-- END: PLANNING_CONSOLE_LAYOUT -->
<!-- ====================================================================== -->

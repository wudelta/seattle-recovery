<!-- ====================================================================== -->
<!-- FILE: aurora/templates/aurora/planning/initiative_template.html -->
<!-- START: INITIATIVE_TEMPLATE -->
<!-- ====================================================================== -->
<template id="planning-initiative-template">
    <article class="planning-initiative planning-paper">
        <header class="planning-section planning-initiative-header">
            <div
                class="d-flex justify-content-between align-items-start gap-3"
            >
                <div class="flex-grow-1 min-w-0">
                    <div class="d-flex align-items-center gap-2 flex-wrap">
                        <h2
                            class="planning-initiative-title mb-0"
                        ></h2>

                        <span
                            class="planning-initiative-status badge"
                        ></span>
                    </div>

                    <div
                        class="planning-initiative-meta planning-muted small d-flex align-items-center gap-2 flex-wrap mt-1"
                    >
                        <span class="planning-initiative-owner"></span>
                        <span
                            class="planning-initiative-meta-separator"
                            aria-hidden="true"
                        >
                            ·
                        </span>
                        <span class="planning-initiative-updated"></span>
                    </div>

                    <p
                        class="planning-initiative-description planning-text mt-2 mb-0"
                    ></p>
                </div>

                <div
                    class="planning-header-actions d-flex align-items-center gap-1 flex-shrink-0"
                >
                    <button
                        type="button"
                        class="planning-edit-initiative-btn planning-icon-btn planning-edit-action"
                        aria-label="Edit Initiative"
                        title="Edit Initiative"
                    >
                        <span aria-hidden="true">✎</span>
                    </button>

                    <button
                        type="button"
                        class="planning-new-phase-btn planning-icon-btn planning-create-action"
                        aria-label="Create Phase"
                        title="Create Phase"
                    >
                        <span aria-hidden="true">+</span>
                    </button>

                    <button
                        type="button"
                        class="planning-delete-initiative-btn planning-icon-btn planning-delete-action"
                        aria-label="Delete Initiative"
                        title="Delete Initiative"
                    >
                        <span aria-hidden="true">×</span>
                    </button>
                </div>
            </div>
        </header>

        <div
            class="planning-phase-form-panel d-none planning-rule"
        >
            <form
                class="planning-phase-form p-3"
                data-phase-id=""
            >
                <div
                    class="d-flex justify-content-between align-items-center mb-3"
                >
                    <div>
                        <div
                            class="planning-phase-form-heading fw-bold text-light"
                        >
                            Create Phase
                        </div>

                        <div
                            class="planning-phase-form-guidance small text-muted"
                        >
                            Add an ordered milestone to this Initiative.
                        </div>
                    </div>

                    <button
                        type="button"
                        class="planning-cancel-phase-btn btn btn-sm btn-outline-secondary"
                    >
                        Cancel
                    </button>
                </div>

                <div
                    class="planning-phase-form-error d-none alert alert-danger py-2"
                    role="alert"
                ></div>

                <div class="row g-3">
                    <div class="col-12 col-lg-9">
                        <label class="form-label small text-light">
                            Title
                        </label>

                        <input
                            name="title"
                            type="text"
                            class="planning-phase-form-title form-control form-control-sm bg-black text-light border-secondary"
                            maxlength="255"
                            required
                        >
                    </div>

                    <div class="col-12 col-lg-3">
                        <label class="form-label small text-light">
                            Status
                        </label>

                        <select
                            name="status"
                            class="planning-phase-form-status form-select form-select-sm bg-black text-light border-secondary"
                        >
                            <option value="PLANNED" selected>
                                Planned
                            </option>
                            <option value="ACTIVE">Active</option>
                            <option value="PAUSED">Paused</option>
                            <option value="COMPLETED">Completed</option>
                            <option value="CANCELLED">Cancelled</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label small text-light">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="planning-phase-form-description form-control form-control-sm bg-black text-light border-secondary"
                            rows="3"
                            placeholder="Describe the milestone, intended result, and boundaries."
                        ></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2 mt-3">
                    <button
                        type="reset"
                        class="btn btn-sm btn-outline-secondary"
                    >
                        Clear
                    </button>

                    <button
                        type="submit"
                        class="planning-save-phase-btn btn btn-sm btn-success"
                    >
                        Save Phase
                    </button>
                </div>
            </form>
        </div>

        <div
            class="planning-phase-list d-flex flex-column"
        ></div>
    </article>
</template>
<!-- ====================================================================== -->
<!-- END: INITIATIVE_TEMPLATE -->
<!-- ====================================================================== -->

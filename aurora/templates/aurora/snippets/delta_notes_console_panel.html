<div class="container-fluid py-2 text-mono" style="font-size: 0.85rem;">
    <!-- Top Control Bar: Unified Session Interface Configuration -->
    <div class="row g-2 mb-2">
        <div class="col-12 d-flex justify-content-between align-items-center bg-black p-2 rounded border border-warning">
            <div class="d-flex align-items-center">
                <span class="text-warning fw-bold me-3">⚡ DELTA_NOTES:</span>
                <span class="text-muted me-3">ID: {{ request.user.username }}</span>
            </div>
            <div class="d-flex align-items-center">
                <div class="bg-dark px-2 py-1 rounded border border-secondary d-flex align-items-center me-3">
                    <span class="text-info me-2 small">SESSION_TIME:</span>
                    <span id="session-timer-display" class="badge bg-black text-warning font-monospace" style="font-size: 0.95rem; border: 1px solid #333;">00:00:00</span>
                    <button id="global-timer-toggle-btn" class="btn btn-outline-success btn-xs py-0 px-2 ms-2" style="font-size: 0.75rem;">Start Session</button>
                </div>
                <button id="compile-blueprint-btn" class="btn btn-warning btn-sm py-1 font-monospace fw-bold" style="font-size: 0.8rem;">🚀 Compile to project.md</button>
            </div>
        </div>
    </div>

    <!-- Main Workspace Split -->
    <div class="row g-2">
        <!-- Left Column: Fast Note Capture Form -->
        <div class="col-md-4">
            <div class="card console-panel h-100">
                <div class="card-header bg-black text-info border-secondary py-1 fw-bold" style="font-size: 0.8rem;">📥 CAPTURE_INTENTION</div>
                <div class="card-body p-2">
                    <form id="create-note-form">
                        <div class="mb-2">
                            <textarea id="note-text" class="form-control console-input" rows="4" placeholder="Enter target parameter configurations..." required style="font-size: 0.8rem;"></textarea>
                        </div>
                        <button type="submit" class="btn btn-outline-info btn-sm w-100 py-1" style="font-size: 0.8rem;">Add to Active Queue</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Right Column: Active Queue Checklist Layer -->
        <div class="col-md-8">
            {% include "aurora/snippets/notes_queue_panel.html" %}
        </div>
    </div>
</div>
<!-- ====================================================================== -->

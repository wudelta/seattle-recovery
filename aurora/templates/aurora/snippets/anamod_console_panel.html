{% load static %}
<div class="d-flex h-100 w-100 text-light font-monospace" style="background-color: #0d0d0d; border-radius: 4px; overflow: hidden; position: relative;">
    
    <!-- COLUMN 1: LEFT FILE SYSTEM DIRECTORY TREE -->
    <div class="p-2 d-flex flex-column border-end border-secondary" style="width: 22%; min-width: 200px; background-color: #121212;">
        <div class="d-flex justify-content-between align-items-center text-uppercase small font-weight-bold text-muted mb-2 border-bottom border-dark pb-1" style="letter-spacing: 1px;">
            <span>📁 Project Hierarchy</span>
            <button id="anamod-new-file-btn" class="btn btn-link p-0 text-success text-decoration-none" title="Create New File" style="font-size: 1.1rem; line-height: 1;"> ➕ </button>
        </div>
        <div id="anamod-file-tree" class="flex-grow-1" style="overflow-y: auto; font-size: 0.85rem;"></div>
    </div>

    <!-- COLUMN 2: CENTER EDITOR CODE VIEWPORT -->
    <div class="d-flex flex-column flex-grow-1 position-relative" style="background-color: #1e1e1e;">
        
        <!-- FIXED: Refactored header bar into a flex row container housing the one-click copy buttons -->
        <div class="d-flex justify-content-between align-items-center px-3 py-1 border-bottom border-dark" style="background-color: #141414; height: 35px;">
            <div id="active-file-indicator" class="text-warning small text-truncate flex-grow-1" title="No file active">No file active</div>
            
            <!-- FIXED: Injected direct clipboard target trigger elements with no inline scripts -->
            <div class="d-flex flex-shrink-0 gap-1 ms-2">
                <button id="anamod-copy-file-btn" class="btn btn-outline-secondary font-monospace"
                        style="font-size: 0.65rem; padding: 0.1rem 0.4rem; text-transform: uppercase; font-weight: bold; border-radius: 3px; line-height: 1.2; color: #8a9ba8; border-color: #30404d;"
                        title="Copy the complete active file contents to clipboard">
                    📄 Copy File
                </button>
                <button id="anamod-copy-path-btn" class="btn btn-outline-secondary font-monospace" 
                        style="font-size: 0.65rem; padding: 0.1rem 0.4rem; text-transform: uppercase; font-weight: bold; border-radius: 3px; line-height: 1.2; color: #8a9ba8; border-color: #30404d;"
                        title="Copy file path location directly to clipboard">
                    📋 Copy Path
                </button>
            </div>
        </div>

        <!-- FIXED ENFORCEMENT WRAPPER: Absolute constraints stop Monaco from pushing past the screen footprint -->
        <div class="position-relative w-100 flex-grow-1" style="min-height: 0; background-color: #1e1e1e;">
            <div id="anamod-monaco-viewport" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%;"></div>
        </div>
    </div>

    <!-- COLUMN 3: RIGHT CONTROL ACTIONS AND SANDBOX TERMINAL -->
    <div class="p-2 d-flex flex-column border-start border-secondary" style="width: 28%; min-width: 250px; background-color: #121212;">
        <div class="text-uppercase small font-weight-bold text-muted mb-2 border-bottom border-dark pb-1" style="letter-spacing: 1px;">
            🛠️ Action Control Matrix
        </div>
        <div class="d-grid gap-2 mb-3">
            <button id="anamod-run-btn" class="btn btn-outline-success btn-sm font-monospace text-uppercase" disabled> ⚡ Execute Sandbox Run </button>
            <div class="row g-1">
                <div class="col-6">
                    <button id="anamod-save-btn" class="btn btn-outline-warning btn-sm font-monospace text-uppercase w-100" disabled> 💾 Save </button>
                </div>
                <div class="col-6">
                    <button id="anamod-discard-btn" class="btn btn-outline-danger btn-sm font-monospace text-uppercase w-100" disabled> ❌ Discard </button>
                </div>
            </div>
        </div>
        <div class="text-uppercase small font-weight-bold text-muted mb-1" style="letter-spacing: 1px; font-size: 0.75rem;">
            🖥️ Isolated Sandbox Console Output
        </div>
        <pre id="anamod-terminal-stream" class="flex-grow-1 p-2 rounded m-0 font-monospace text-success bg-black border border-dark small" style="overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.25; font-size: 0.8rem; border-color: #222 !important;">[SYSTEM READY] Initialize session trace matrix...</pre>
    </div>

    <!-- DECOUPLED RIGHT-CLICK CONTEXT MENU INTERFACE NODE FOR FILES -->
    <div id="anamod-tree-context-menu" class="position-absolute dropdown-menu dropdown-menu-dark p-1 border-secondary shadow-lg font-monospace" style="display: none; min-width: 130px; font-size: 0.8rem; z-index: 1000; background-color: #1c1c1e;">
        <button id="ctx-rename-btn" class="dropdown-item px-2 py-1 text-light bg-transparent border-0 text-start w-100" style="cursor: pointer;">✏️ Rename File</button>
        <div class="dropdown-divider my-1 border-secondary"></div>
        <button id="ctx-delete-btn" class="dropdown-item px-2 py-1 text-danger bg-transparent border-0 text-start w-100" style="cursor: pointer;">🗑️ Delete File</button>
    </div>

    <!-- NEW DECOUPLED RIGHT-CLICK CONTEXT MENU INTERFACE NODE FOR FOLDERS -->
    <div id="anamod-folder-context-menu" class="position-absolute dropdown-menu dropdown-menu-dark p-1 border-secondary shadow-lg font-monospace" style="display: none; min-width: 190px; font-size: 0.8rem; z-index: 1000; background-color: #1c1c1e;">
        <button id="ctx-add-file-btn" class="dropdown-item px-2 py-1 text-success bg-transparent border-0 text-start w-100" style="cursor: pointer;">➕ Add New File Here</button>
        <button id="ctx-add-directory-btn" class="dropdown-item px-2 py-1 text-success bg-transparent border-0 text-start w-100" style="cursor: pointer;">📁 Add New Directory Here</button>
    </div>

</div>
<!-- ====================================================================== -->
<!-- END: ANAMOD_VIEWPORT_SCALING_CLAMP (PATCH 1 OF 1) -->

<div class="d-flex h-100 w-100 text-light font-monospace" style="background-color: #0d0d0d; border-radius: 4px; overflow: hidden;">
    <!-- COLUMN 1: LEFT FILE SYSTEM DIRECTORY TREE -->
    <div class="p-2 d-flex flex-column border-end border-secondary" style="width: 22%; min-width: 200px; background-color: #121212;">
        <div class="text-uppercase small font-weight-bold text-muted mb-2 border-bottom border-dark pb-1" style="letter-spacing: 1px;">
            📁 Project Hierarchy
        </div>
        <div id="anamod-file-tree" class="flex-grow-1" style="overflow-y: auto; font-size: 0.85rem;"></div>
    </div>

    <!-- COLUMN 2: CENTER EDITOR CODE VIEWPORT -->
    <div class="d-flex flex-column flex-grow-1 position-relative" style="background-color: #1e1e1e;">
        <div class="d-flex justify-content-between align-items-center px-3 py-1 border-bottom border-dark" style="background-color: #141414; height: 35px;">
            <div id="active-file-indicator" class="text-warning small text-truncate" style="max-width: 400px;">
                No file active
            </div>
            <div class="small text-muted" id="editor-status-node">
                Monaco Workspace Ready
            </div>
        </div>
        <!-- FIXED ENFORCEMENT WRAPPER: Absolute constraints stop Monaco from pushing past the screen footprint -->
        <div class="position-relative w-100 flex-grow-1" style="min-height: 0; background-color: #1e1e1e;">
            <div id="anamod-monaco-viewport" style="position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%;"></div>
        </div>
    </div>

    <!-- COLUMN 3: RIGHT CONTROL ACTIONS AND SANDBOX TERMINAL -->
    <div class="p-2 d-flex flex-column border-start border-secondary" style="width: 28%; min-width: 250px; background-color: #121212;">
        <div class="text-uppercase small font-weight-bold text-muted mb-2 border-bottom border-dark pb-1" style="letter-spacing: 1px;">
            🛠️ Action Control Matrix
        </div>
        <div class="d-grid gap-2 mb-3">
            <button id="anamod-run-btn" class="btn btn-outline-success btn-sm font-monospace text-uppercase" disabled>
                ⚡ Execute Sandbox Run
            </button>
            <button id="anamod-lint-btn" class="btn btn-outline-info btn-sm font-monospace text-uppercase" disabled>
                🔍 Lint Active Code
            </button>
            <div class="row g-1">
                <div class="col-6">
                    <button id="anamod-save-btn" class="btn btn-outline-warning btn-sm font-monospace text-uppercase w-100" disabled>
                        💾 Save
                    </button>
                </div>
                <div class="col-6">
                    <button id="anamod-discard-btn" class="btn btn-outline-danger btn-sm font-monospace text-uppercase w-100" disabled>
                        ❌ Discard
                    </button>
                </div>
            </div>
        </div>
        <div class="text-uppercase small font-weight-bold text-muted mb-1" style="letter-spacing: 1px; font-size: 0.75rem;">
            🖥️ Isolated Sandbox Console Output
        </div>
        <pre id="anamod-terminal-stream" class="flex-grow-1 p-2 rounded m-0 font-monospace text-success bg-black border border-dark small" style="overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.25; font-size: 0.8rem; border-color: #222 !important;">[SYSTEM READY] Initialize session trace matrix...</pre>
    </div>
</div>

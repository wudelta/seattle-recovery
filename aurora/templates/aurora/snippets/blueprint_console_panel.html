<div class="d-flex flex-column h-100 w-100">
    <!-- Top Workspace Split (Input, Streaming Logs, System Validation) -->
    <div class="row console-top-row g-2 mb-2 flex-grow-1">
        
        <!-- Panel 1: Blueprint Desk -->
        <div class="col-md-4 d-flex flex-column h-100">
            <div class="card border-secondary h-100 bg-black text-light">
                <div class="card-header py-1 font-monospace small text-purple-emphasis">🛠️ Blueprint Desk</div>
                <div class="card-body d-flex flex-column p-2">
                    <textarea id="blueprint-input" class="form-control bg-darker text-info font-monospace flex-grow-1 mb-2 small" placeholder="Enter plain-English commands for Wu..."></textarea>
                    <button id="submit-blueprint" class="btn btn-success btn-sm w-100 font-monospace fw-bold">Command</button>
                </div>
            </div>
        </div>

        <!-- Panel 2: Minion Assembly Line -->
        <div class="col-md-4 d-flex flex-column h-100">
            <div class="card border-secondary h-100 bg-black text-light">
                <div class="card-header py-1 font-monospace small text-purple-emphasis">🤖 Minion Assembly Line</div>
                <div class="card-body p-2 overflow-auto font-monospace small scrollable-panel" id="minion-feed">
                    <div class="text-muted">[System] Standing by for blueprints...</div>
                </div>
            </div>
        </div>

        <!-- Panel 3: Validation Inspector -->
        <div class="col-md-4 d-flex flex-column h-100">
            <div class="card border-secondary h-100 bg-black text-light">
                <div class="card-header py-1 font-monospace small text-purple-emphasis">🔬 Validation Inspector</div>
                <div class="card-body p-2 overflow-auto font-monospace small scrollable-panel" id="inspector-output">
                    <div class="text-success">✔ Syntax Check: Passed</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Workspace Split (Code Crucible Script Review) -->
    <div class="row console-bottom-row g-2 flex-shrink-0" style="height: 40%;">
        <div class="col-12 h-100 d-flex flex-column">
            <div class="card border-secondary h-100 bg-black text-light">
                <div class="card-header py-1 font-monospace small d-flex justify-content-between align-items-center text-purple-emphasis">
                    <span>🔥 Code Crucible</span>
                    <button id="forge-deploy" class="btn btn-sm py-0 font-monospace text-white" style="background-color: #6f42c1; font-size: 0.75rem;">Forge & Deploy Changes</button>
                </div>
                <div class="card-body p-2 d-flex flex-column h-100 overflow-hidden">
                    <pre class="p-2 mb-0 rounded flex-grow-1 overflow-auto font-monospace small scrollable-panel" id="code-viewer"># Wu's code blocks stream here...</pre>
                </div>
            </div>
        </div>
    </div>
</div>

  known_issues:

    - Provider routing is functioning through the ProviderRouter and requires only production validation.
    - DeltaDirective constraints still contain legacy prompt instructions that predate Protocol v3.2.
    - Wu can generate repository patches only when file contents are manually supplied.
    - No runtime workspace context resolver currently hydrates repository files into Wu prompts.
    - No active parser currently consumes Wu [PATCH_START]/[PATCH_END] responses.
    - The Wu review slider implementation exists only on the historical feature/wu-monaco-diff-slider branch and was previously reverted due to instability.
    - Existing transaction approval UI is command-oriented and not yet integrated with AI patch review.
    - Console websocket infrastructure exists but is only partially utilized for execution telemetry.
    - Automated tests require reconstruction following the provider architecture refactor.

  next_task: >
    Reconstruct the Wu-assisted refactoring workflow using small,
    isolated components. Restore a stable Wu review slider, implement
    safe workspace context hydration, parse AI patch responses into
    structured review payloads, reconnect Monaco-based review, and
    validate the complete approval workflow before enabling automatic
    repository mutations.

  notes:

    - ADR-001 through ADR-003 remain the architectural source of truth.
    - Provider abstraction has reached baseline implementation and is no longer the primary development focus.
    - Wu Chat is now the validation harness for the complete AI-assisted development workflow.
    - Provider implementations remain responsible only for SDK integration.
    - Repository context resolution is a separate architectural concern from provider execution.
    - AI patch review must remain isolated from the standalone Anamod editor.
    - The historical feature/wu-monaco-diff-slider branch is a behavioral reference only and must not be merged directly.
    - Repository documentation is the authoritative project memory.
    - Preserve anchor topology during all repository modifications.
    - Apply The Delta Way: small, reversible, production-safe iterations.
    - Commit checkpoint established:
      14ac790 - refactor: introduce provider abstraction and routing layer

  current_objective: >
    Complete the Aurora baseline by July 15, 2026. Following merge into
    main, shift development effort toward HopeHub with a target beta
    deployment by August 15, 2026.

  next_major_milestone: Aurora Baseline (2026-07-15)

  project_target: HopeHub Beta Prototype (2026-08-15)


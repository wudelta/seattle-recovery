known_issues:

* Provider Router has not yet been implemented.
* Model resolution policy has not yet been centralized.
* DeltaDirective constraints still contain legacy provider-specific values.
* Direct Gemini SDK usage still exists within the execution engine.
* Automated tests require redesign following the architecture refactor.

next_task: >
Implement the Provider Router as defined by ADR-002,
including centralized model resolution and provider
selection. Refactor the execution engine to delegate
all provider decisions to the router before completing
provider implementations.

notes:

* ADR-001 through ADR-003 are now the architectural source of truth.
* The execution engine must remain vendor-independent.
* No direct SDK usage outside provider implementations.
* Provider implementations must not contain routing or failover logic.
* Routing policy belongs to the Provider Router.
* Model names must not appear in application code.
* Preserve anchor topology during all source modifications.
* Green Build Rule remains in effect.
* Automated test reconstruction is intentionally deferred until the implementation baseline is stable.

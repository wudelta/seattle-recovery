approval_contract:
  approve:
    - receive validated pending review
    - verify repository boundary
    - verify reviewed source remains unchanged
    - perform exactly one repository write
    - record applied status
  reject:
    - record rejection
    - perform no repository mutation

architectural_boundaries:
  provider:
    owns:
      - sdk integration
      - provider execution
      - usage normalization
    must_not:
      - read repository files
      - parse patches
      - mutate repository files

  workspace_context:
    module: aurora/minions/workspace_context.py
    owns:
      - repository path recognition
      - repository boundary validation
      - source hydration
    must_not:
      - invoke providers
      - create reviews
      - mutate files

  patch_parser:
    module: aurora/minions/patch_parser.py
    owns:
      - structured patch validation
      - malformed response rejection
      - review payload creation
    must_not:
      - mutate repository files

  pending_code_change:
    owns:
      - review persistence
      - source verification
      - approval state
      - single approved repository write

known_issues:
  - Remove remaining temporary diagnostic logging before merge if still present.
  - Automated test expansion remains intentionally deferred until after baseline stabilization.

session_resume:

project:
  name: Aurora
  branch: feature/provider-abstraction

targets:
  aurora_baseline: achieved
  hopehub_beta_prototype: 2026-08-15

current:
  phase: post_baseline_transition
  objective: >
    Transition Aurora from a validated AI execution platform into the
    engineering environment that will build HopeHub while preserving
    the completed baseline.

  next_task: >
    Design and implement the Wu Session Lifecycle, establish
    orchestration boundaries for future minions, and correct Docker
    repository ownership so all development tools operate under the
    host user's identity.

last_verified:
  date: 2026-07-14

  milestone:
    aurora_baseline: achieved

  workflow:
    provider_abstraction: complete
    workspace_context_resolution: complete
    repository_file_hydration: complete
    structured_patch_generation: validated
    structured_patch_parsing: validated
    wu_review_slider: validated
    monaco_diff_viewer: validated
    approval_workflow: validated
    repository_single_write: validated
    telemetry_pipeline: implemented

current_initiatives:

  wu_session_lifecycle:

    status: active

    objectives:

      - establish START SESSION workflow
      - establish END SESSION workflow
      - separate analysis from Build Mode
      - preserve Wu as an engineering collaborator
      - move detailed procedures toward specialized minions
      - avoid procedural context bloat

  repository_permissions:

    status: active

    objectives:

      - inspect Docker runtime user
      - align container UID/GID with host user
      - eliminate root-owned repository artifacts
      - validate Anamod-generated files

validation_strategy:

  regression:
    approach: >
      Validate Aurora by performing real engineering work through Wu
      rather than executing an artificial regression checklist.

    success_definition:
      - normal development remains reliable
      - architectural boundaries remain intact
      - no baseline regressions discovered during real use

known_issues:

  - Minor Aurora console refinements remain intentionally deferred.
  - Detailed automated regression testing remains deferred until HopeHub development stabilizes.

architectural_direction:

  wu:
    role: engineering_collaborator_and_orchestrator

  minions:
    role: specialized_execution_capabilities

  authority:
    wu:
      - architectural reasoning
      - session coordination
      - engineering discussion
      - minion selection

    minions:
      - specialized execution
      - deterministic validation
      - bounded responsibilities

session_resume:

  read_first:

    - docs/protocol/Aurora_Refactoring_Protocol_v3_2.md
    - docs/management/PROJECT_STATE.yaml
    - docs/architecture/MINION_ARCHITECTURE.md
    - docs/vision/HOPEHUB_ENGINEERING_CONTRACT.md

  immediate_focus:

    - Wu Session Lifecycle
    - Docker permissions
    - Task-driven baseline validation

project_brain:

  startup_required:

    - protocol
    - project_state
    - current_source_file

  load_only_when_needed:

    roadmap: strategic_discussion
    engineering_contract: hopehub_work
    migration_checklist: merge_or_major_refactor
    session_log: historical_investigation

principles:

  - Repository documentation is authoritative.
  - Keep operational context compact.
  - Preserve behavioral and project-context separation.
  - Prefer principles over accumulated procedural rules.
  - Wu coordinates specialized capabilities rather than containing every rule.
  - Apply The Delta Way.


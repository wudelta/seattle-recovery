  known_issues:

    - Provider routing is functioning through the ProviderRouter and has passed baseline validation.
    - DeltaDirective constraints still contain legacy prompt instructions that predate Protocol v3.2.
    - Workspace context hydration is operational but requires additional functional validation with live Wu prompts.
    - Structured [PATCH_START]/[PATCH_END] parsing is integrated but requires additional validation against malformed and truncated AI responses.
    - Patch parsing currently returns review metadata only and intentionally performs no automatic file mutations.
    - The historical transaction approval workflow has been removed and replaced by the new structured patch architecture.
    - Wu Chat frontend has not yet been updated to consume the new patch and patch_error response payloads.
    - Monaco-based patch review UI has not yet been reconnected to the structured review pipeline.
    - Console websocket infrastructure exists but is only partially utilized for execution telemetry.
    - Automated tests require reconstruction following the provider architecture refactor.

  next_task: >
    Complete the frontend integration of the structured patch review
    workflow. Connect Wu Chat to the new patch payload, restore the
    Monaco review interface, validate successful and malformed patch
    responses, and complete the human approval workflow before enabling
    any automated repository mutations.

  notes:

    - ADR-001 through ADR-003 remain the architectural source of truth.
    - Provider abstraction has reached baseline implementation and is no longer the primary development focus.
    - Wu Chat is now the validation harness for the complete AI-assisted development workflow.
    - Provider implementations remain responsible only for SDK integration.
    - Repository context resolution is architecturally isolated from provider execution.
    - Structured patch parsing is architecturally isolated from repository mutation.
    - AI patch review must remain isolated from the standalone Anamod editor.
    - The historical feature/wu-monaco-diff-slider branch is a behavioral reference only and must not be merged directly.
    - Repository documentation is the authoritative project memory.
    - Preserve anchor topology during all repository modifications.
    - Apply The Delta Way: small, reversible, production-safe iterations.
    - Today's refactor removed the legacy WorkspaceTransaction / TrackedCommand approval architecture in favor of structured patch review.
    - Commit checkpoint established:
      14ac790 - refactor: introduce provider abstraction and routing layer

  current_objective: >
    Complete the Aurora baseline by July 15, 2026. Following merge into
    main, shift development effort toward HopeHub with a target beta
    deployment by August 15, 2026.

  next_major_milestone: Aurora Baseline (2026-07-15)

  project_target: HopeHub Beta Prototype (2026-08-15)


known_issues:

```
- Provider routing is functioning through ProviderRouter and has passed baseline validation.
- DeltaDirective constraints still contain legacy prompt instructions that predate Protocol v3.2.
- Workspace context hydration is operational but requires additional validation with live Wu refactoring prompts.
- Structured [PATCH_START]/[PATCH_END] parsing is integrated but requires validation against malformed and truncated AI responses.
- Patch parsing returns structured review metadata and intentionally performs no automatic repository mutation.
- The historical WorkspaceTransaction and TrackedCommand approval architecture has been removed.
- The existing Wu review slider and isolated Monaco diff viewer are functional and do not require reconstruction.
- The Monaco diff model orientation currently presents proposed content as the original model and current content as the modified model.
- Wu Chat recognizes patch and patch_error response fields but does not yet invoke window.WuDiffViewer.show(response.patch).
- No structured review slider appeared during the latest live Wu request, so the backend response payload must be inspected before further frontend changes.
- The telemetry viewport is present, but no execution telemetry was received during the latest Wu validation request.
- PendingCodeChange approval and verified repository writing are not connected to the review interface.
- Automated tests require reconstruction following the provider architecture refactor.
```


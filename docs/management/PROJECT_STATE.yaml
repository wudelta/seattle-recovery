  known_issues:

    - Provider routing requires production validation using OpenAI and Gemini.
    - Provider failover policy remains to be implemented.
    - Model resolution policy has not yet been fully centralized.
    - DeltaDirective constraints still contain legacy provider-specific values.
    - Every Wu interaction currently generates a WorkspaceTransaction regardless of intent.
    - Approval drawer is triggered for conversational responses because transaction intent is not yet classified.
    - Monaco slideout workflow requires validation before legacy approval UI is removed.
    - Console websocket infrastructure exists but is only partially utilized for telemetry.
    - Legacy browser-side chat history collection appears obsolete following ChatLedger implementation.
    - Automated tests require reconstruction following the provider architecture refactor.

  next_task: >
    Complete Wu Chat integration validation by tracing the browser
    execution path end-to-end, verify provider routing, validate
    telemetry behavior, classify conversational versus mutation
    requests, repair the slideout workflow, remove redundant approval
    mechanisms, and prepare the provider abstraction branch for merge.

  notes:

    - ADR-001 through ADR-003 remain the architectural source of truth.
    - Wu Chat is now the primary validation harness for the AI Execution Platform.
    - Provider implementations remain responsible only for SDK integration.
    - Routing policy belongs exclusively to the Provider Router.
    - Repository documentation is the authoritative project memory.
    - Preserve anchor topology during all repository modifications.
    - Green Build Rule remains in effect.
    - Apply The Delta Way: small, reversible, production-safe iterations.
    - Commit checkpoint established:
      14ac790 - refactor: introduce provider abstraction and routing layer

  current_objective: >
    Complete the Aurora baseline by July 15, 2026. Following merge into
    main, shift development effort toward HopeHub with a target beta
    deployment by August 15, 2026.

  next_major_milestone: Aurora Baseline (2026-07-15)

  project_target: HopeHub Beta Prototype (2026-08-15)


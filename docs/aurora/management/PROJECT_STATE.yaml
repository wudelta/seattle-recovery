project:
  name: Aurora
  branch: feature/provider-abstraction

targets:
  aurora_baseline: achieved
  hopehub_beta_prototype: 2026-08-15

current:

  phase: explicit_workspace_synchronization

  objective: >
    Complete Aurora's deterministic repository intelligence layer by
    maintaining PostgreSQL as the authoritative engineering catalog and
    Neo4j as an explicit, recoverable projection used for dependency
    traversal and AI context acquisition.

  next_task: >
    Implement durable graph synchronization state so incremental graph
    projection advances naturally through the repository without
    reprocessing already synchronized components.

  governing_deadline: >
    Continue Aurora work only while it directly improves engineering
    productivity or validates infrastructure required for the HopeHub
    beta scheduled for August 15, 2026.


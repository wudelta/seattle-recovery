    existing_record_convergence: passed

active_initiative:
  name: workspace_reconciliation_and_knowledge_graph
  status: active
  priority: critical
  implementation_mode: go_loop

  architectural_purpose: >
    Aurora must prefer deterministic computation whenever repository discovery,
    classification, freshness detection, dependency traversal, workflow
    execution, or context selection can be solved without AI. AI remains an
    optional interpretation and enrichment layer.

  desired_outcome:
    component_registry: >
      PostgreSQL contains current, searchable, business-relevant components
      with stable repository paths, architectural classification, freshness
      metadata, and concise responsibility summaries.

    dependency_graph: >
      Neo4j contains synchronized component nodes and explicit dependency
      relationships suitable for impact analysis and context expansion.

    wu_context: >
      Wu searches registered components, follows relevant dependency
      neighborhoods, hydrates known paths automatically, avoids repeated file
      requests, and stops gathering context when sufficient information exists.

    hopehub_foundation: >
      The PostgreSQL-authoritative and Neo4j-relationship pattern is validated
      before being applied to HopeHub resource-finder domain data.

architecture:
  authoritative_metadata:
    system: PostgreSQL
    model: ComponentRegistry

  relationship_topology:
    system: Neo4j
    model: ComponentNode

  synchronization:
    direction: PostgreSQL_to_Neo4j
    policy: explicit_bounded_and_recoverable

  deterministic_pipeline:
    - component policy
    - repository discovery
    - reconciliation
    - SHA-256 source freshness
    - controlled PostgreSQL synchronization
    - graph synchronization
    - dependency traversal
    - AI context assembly

  ai_boundary:
    role:
      - interpretation
      - documentation enrichment
      - architectural critique
      - recommendations
      - code generation
    rule: >
      AI availability must never block deterministic inventory, freshness
      detection, synchronization, or graph rebuilding.

reconciliation:
  default_mode: dry_run
  repository_file_mutation: prohibited
  database_mutation: explicit_only
  graph_mutation: explicit_only

  classifications:
    KEEP: eligible registry record matches the repository
    UPDATE: existing eligible record has stale managed metadata or source hash
    REGISTER: eligible repository file has no registry record
    STAGE: registered component is missing from the repository
    EXCLUDE: registry record violates current component policy
    REVIEW: business relevance cannot be determined safely

  component_scope:
    allowed_roots:
      - aurora
      - hopehub
      - users
      - core_logic
      - docs

    allowed_root_files:
      - manage.py

    exclusions:
      - migrations
      - tests
      - caches
      - virtual environments
      - Monaco and vendor assets
      - collected static files
      - logs and temporary staging
      - credentials and secrets
      - generated and minified assets

    governing_test: >
      Register a file only when a developer or Wu would reasonably inspect it
      while changing application behavior, architecture, user experience,
      security, configuration, or authoritative documentation.

completed_work:
  component_policy:
    status: validated
    capabilities:
      - normalized repository-relative paths
      - traversal rejection
      - allowed-root enforcement
      - deterministic exclusions
      - persona inference
      - content-aware __init__.py classification
      - secret and credential protection

  workspace_reconciler:
    status: validated
    capabilities:
      - read-only repository traversal
      - KEEP UPDATE REGISTER STAGE EXCLUDE REVIEW reporting
      - SHA-256 exact-source hashing
      - accurate bounded reporting
      - root path and display-limit filters
      - no PostgreSQL Neo4j AI or repository mutations

  management_command:
    file: aurora/management/commands/reconcile_workspace.py
    status: validated
    behavior:
      - dry-run only
      - root filter
      - path filter
      - display limit
      - full matching counts preserved when output is limited

  registry_freshness:
    status: validated
    migration: 0004_componentregistry_analysis_status_and_more
    fields:
      - source_hash
      - last_observed_at
      - last_analyzed_at
      - analysis_status
      - analysis_version

  workspace_synchronizer:
    status: existing_updates_validated
    behavior:
      - preview by default
      - apply requires explicit true value
      - path and limit boundaries
      - updates existing rows through QuerySet.update
      - bypasses post-save signals
      - writes source hash and observation timestamp
      - applies authoritative persona corrections
      - performs no registration staging deletion Neo4j or AI work

  current_registry_state:
    existing_eligible_records: converged_to_KEEP
    eligible_unregistered_files: approximately_102
    missing_registered_files: 1
    policy_excluded_registry_records: 36

implementation_sequence:
  step_01_component_policy: complete
  step_02_dry_run_reconciler: complete
  step_03_management_command: complete
  step_04_registry_freshness: complete
  step_05_existing_record_apply: complete

  step_05_new_registration:
    status: next
    requirement: >
      Register eligible files safely without invoking obsolete post-save graph
      behavior or whole-workspace AST scans.

  step_06_graph_schema:
    status: pending
    requirement: >
      Add deliberate ComponentNode projection properties for name, persona,

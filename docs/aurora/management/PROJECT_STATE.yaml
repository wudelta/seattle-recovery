principles:

  - HopeHub beta ships August 15, 2026.
  - Prefer deterministic computation before AI.
  - PostgreSQL owns authoritative engineering metadata.
  - Neo4j is an explicit projection.
  - Dry-run is the default.
  - Mutation requires explicit apply.
  - Repository reconciliation never modifies source files.
  - Never ask AI to compute what software can compute.
  - Never ask AI to remember what software can record.
  - Apply The Delta Way.


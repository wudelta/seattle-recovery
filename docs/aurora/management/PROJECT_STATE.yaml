notes: >
Aurora now contains implemented Initiative, Phase, and Step planning models,
but those models are not yet integrated into Wu's working context or execution
workflow. An older DeltaNotesEntry concept proposed a Project Dashboard that
would process unhandled notes into AI instructions, assign work to minions,
expose an Execute button, and submit implementation attempts for approval.
That concept remains useful background but is not an approved implementation
plan. The current decision is to pause before coding and conduct a high-level
architectural review. The first implementation should be small, deterministic,
independently useful, and likely read-only. It should establish reliable
project-state visibility for both Delta and Wu before adding AI triage,
assignment, execution, or autonomous repository changes. This restraint is
informed by the cleanup completed on 2026-07-21, which removed remnants of
earlier subsystem-scale attempts, including the legacy direct Gemini chat path.


principles:
  - HopeHub beta ships on August 15, 2026.
  - Prefer deterministic computation before AI inference.
  - The same inputs should produce the same engineering workflow.
  - Repository files remain read-only to reconciliation.
  - PostgreSQL owns authoritative component metadata.
  - Neo4j owns traversable relationships.
  - Dry-run is the default.
  - Mutation requires explicit bounded apply.
  - Never delete registry or graph records automatically.
  - Do not ask AI to remember what software can record.
  - Do not ask AI to infer what software can compute.
  - Do not ask AI to discover what software can index.
  - Apply The Delta Way.


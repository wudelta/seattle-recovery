    Wu with sufficient repository context before AI reasoning is invoked.

architecture:

  authoritative_metadata:

    system: PostgreSQL
    model: ComponentRegistry

  relationship_projection:

    system: Neo4j
    model: ComponentNode

    policy: explicit_projection_only

  synchronization:

    direction: PostgreSQL_to_Neo4j

    guarantees:

      - preview_before_apply
      - explicit_execution
      - bounded_operations
      - recoverable_execution
      - idempotent_projection

  deterministic_pipeline:

    - repository discovery
    - component classification
    - reconciliation
    - PostgreSQL synchronization
    - graph projection
    - dependency traversal
    - AI context assembly

  ai_boundary:

    deterministic_first: true

    AI_responsibilities:

      - interpretation
      - documentation enrichment
      - recommendations
      - code generation

    deterministic_responsibilities:

      - repository discovery
      - classification
      - synchronization
      - graph rebuilding
      - context indexing


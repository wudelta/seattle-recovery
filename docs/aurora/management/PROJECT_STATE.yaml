current_design_questions:

* How should Wu consume Initiative, Phase, and Step records as project context?
* What is the smallest Project Dashboard milestone that provides immediate value?
* Should the first dashboard be read-only and expose only current project state?
* How should unprocessed DeltaNotesEntry records enter the planning hierarchy?
* Which actions require explicit human approval before creating planning records?
* Should minion assignment live on Step, on a future execution record, or both?
* Is a transient StepExecution-style model eventually required?
* How should execution state remain separate from durable project planning state?
* How should PendingCodeChange participate in future Step execution and approval?

remaining_work:

immediate:

```
- Conduct a high-level architectural discussion before modifying code.
- Inspect the implemented Initiative, Phase, and Step models.
- Define the first independently useful Project Dashboard milestone.
- Define the minimum project context Wu needs to answer what is active and what comes next.
- Preserve DeltaNotesEntry as an informal intake mechanism until its promotion workflow is designed.
- Avoid implementing AI triage, minion execution, and approval orchestration as one subsystem.
```

likely_first_milestone:

```
- Create a read-only project-state projection.
- Identify the active Initiative.
- Identify the current Phase.
- Identify the current or next incomplete Step.
- Expose paused and planned work.
- Make the same deterministic project context available to Wu.
- Perform no AI planning, minion assignment, or repository mutation.
```

deferred_until_designed:

```
- AI-assisted DeltaNotesEntry triage.
- Promotion of notes into Initiatives, Phases, or Steps.
- Minion recommendation and assignment.
- Prepared execution packages.
- Execute controls.
- Step execution tracking.
- Automated implementation attempts.
- Validation-driven Step completion.
- Automatic Phase and Initiative completion.
- Integration with PendingCodeChange approval workflows.
```

next_major_phase:

```
- Enable Wu to consume deterministic project-planning context.
- Enable repository-aware subsystem analysis using ComponentRegistry metadata.
- Begin HopeHub engineering implementation.
- Continue the mobile-first API transition.
- Design and implement the automated /end-session workflow, including verified backups and off-site replication.
```

principles:

architecture:

```
- Builders perform deterministic filesystem mutation only.
- WorkspaceSynchronizer is the sole authority for repository synchronization.
- AI enrichment operates only on deterministic registry output.
- Standing AI behavior resides in DeltaDirectives.
- Application code supplies task context only.
- TelemetryLogger owns telemetry.
- Business logic remains isolated from orchestration.
- No automatic generated unit tests.
- Maintain deterministic, reversible workflows.
- DeltaNotesEntry is an intake mechanism, not an executable instruction.
- Initiative, Phase, and Step records represent durable approved project planning.
- Execution state must remain distinct from durable planning state.
- AI proposals must remain reviewable before they modify the project plan.
- Execute operations must apply to bounded Steps rather than informal notes.
- Every implementation milestone must provide standalone value.
- Do not attack the entire planning and execution subsystem at once.
```


principles:

* Package boundaries represent subsystem ownership.
* Deterministic versus AI behavior is not an architectural boundary.
* Builders perform deterministic mutation only.
* WorkspaceSynchronizer remains the authority for repository synchronization.
* AI enriches deterministic outputs rather than replacing them.
* Execution state remains distinct from durable project planning.
* Every milestone must provide independent value.
* Preserve deterministic, reversible workflows.


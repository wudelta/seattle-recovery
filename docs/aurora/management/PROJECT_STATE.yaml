  step_11_hopehub_pattern_validation:
    status: pending

  step_12_retirement_and_cleanup:
    status: pending

known_issues:
  - New ComponentRegistry creation still triggers obsolete post-save graph logic.
  - ComponentNode lacks metadata currently assigned by signals.
  - ComponentRegistry saves may trigger whole-workspace AST scanning.
  - signals.py contains obsolete CONTROLLER_MODULE and CANVAS_LAYOUT behavior.

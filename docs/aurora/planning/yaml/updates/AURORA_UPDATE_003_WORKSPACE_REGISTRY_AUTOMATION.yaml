# ======================================================================
# FILE: docs/aurora/planning/yaml/updates/AURORA_UPDATE_003_WORKSPACE_REGISTRY_AUTOMATION.yaml
# START: WORKSPACE_REGISTRY_AUTOMATION_INITIATIVE
# ======================================================================

schema_version: 1

target:
  project_slug: aurora

add_initiatives:

  - title: Workspace Registry Automation
    description: >
      Create one safe, memorable Aurora slash command that coordinates
      repository reconciliation, ComponentRegistry updates, new component
      registration, graph synchronization, AI-assisted documentation, and
      final registry-health validation.

      The workflow must preserve the existing deterministic safety boundaries
      while eliminating the need for Delta or Wu to remember multiple
      management commands, command arguments, execution order, or recovery
      procedures.
    status: PLANNED

    phases:

      - title: Workspace Synchronization Contract
        description: >
          Define the authoritative workflow, command interface, safety rules,
          execution boundaries, and completion criteria for automated
          ComponentRegistry maintenance.
        status: PLANNED

        steps:

          - title: Define the synchronization workflow
            description: >
              Specify the authoritative operation order for reconciliation,
              existing-record updates, new-record registration, graph
              synchronization, component documentation, and final validation.
            status: PLANNED
            estimated_minutes: 90
            estimate_confidence: MEDIUM
            risk_level: MEDIUM
            validation_description: >
              A versioned workflow contract defines every operation, its order,
              its inputs, and its expected outputs.

          - title: Define slash command syntax
            description: >
              Establish a concise command interface supporting full-workspace
              synchronization, status inspection, and optional application-root
              or repository-path boundaries.
            status: PLANNED
            estimated_minutes: 60
            estimate_confidence: HIGH
            risk_level: LOW
            validation_description: >
              The command contract defines memorable forms including workspace
              status, full synchronization, root-scoped synchronization, and
              path-scoped synchronization.

          - title: Define safety and failure behavior
            description: >
              Preserve preview-before-apply behavior, explicit mutation
              boundaries, registration ownership requirements, visible
              PostgreSQL and Neo4j failures, and deliberate retry behavior.
            status: PLANNED
            estimated_minutes: 90
            estimate_confidence: MEDIUM
            risk_level: HIGH
            validation_description: >
              The workflow contract prohibits silent mutation and defines how
              partial failures are reported, halted, and retried.

      - title: Deterministic Workspace Orchestration
        description: >
          Implement a reusable orchestration service that coordinates the
          existing deterministic reconciliation and synchronization services
          without depending on Wu or duplicated command-line logic.
        status: PLANNED

        steps:

          - title: Extract reusable command orchestration
            description: >
              Introduce an application service that invokes workspace
              reconciliation and synchronization operations directly while
              keeping Django management commands as independent administrative
              interfaces.
            status: PLANNED
            estimated_minutes: 180
            estimate_confidence: LOW
            risk_level: HIGH
            validation_description: >
              Management commands and slash commands use the same authoritative
              orchestration service rather than duplicating workflow logic.

          - title: Implement workspace status reporting
            description: >
              Provide a read-only operation that reports KEEP, UPDATE, REGISTER,
              STAGE, EXCLUDE, and REVIEW classifications with optional root or
              path boundaries.
            status: PLANNED
            estimated_minutes: 120
            estimate_confidence: MEDIUM
            risk_level: MEDIUM
            validation_description: >
              The orchestration service produces the same bounded deterministic
              reconciliation results as reconcile_workspace.

          - title: Implement bounded synchronization execution
            description: >
              Coordinate updates, registrations, and graph synchronization
              using explicit boundaries and existing WorkspaceSynchronizer
              safeguards.
            status: PLANNED
            estimated_minutes: 180
            estimate_confidence: LOW
            risk_level: HIGH
            validation_description: >
              The service can preview and apply each mutation stage without
              bypassing existing path, limit, ownership, or graph controls.

      - title: Slash Command Integration
        description: >
          Expose the workspace-maintenance orchestration through a memorable
          Aurora slash command that can operate before Wu becomes the primary
          consumer of repository contracts.
        status: PLANNED

        steps:

          - title: Implement workspace status slash command
            description: >
              Add a read-only slash command that displays current reconciliation
              classifications and summarizes repository-to-registry drift.
            status: PLANNED
            estimated_minutes: 120
            estimate_confidence: MEDIUM
            risk_level: MEDIUM
            validation_description: >
              The workspace status command reports registry drift without
              modifying PostgreSQL, Neo4j, or repository files.

          - title: Implement workspace sync slash command
            description: >
              Add a slash command that coordinates the approved synchronization
              workflow and clearly separates preview results from applied
              changes.
            status: PLANNED
            estimated_minutes: 180
            estimate_confidence: LOW
            risk_level: HIGH
            validation_description: >
              A single memorable command can preview and execute the complete
              deterministic registry-maintenance workflow.

          - title: Implement scoped synchronization
            description: >
              Allow the slash command to restrict work to an approved
              application root or safe repository-relative path.
            status: PLANNED
            estimated_minutes: 120
            estimate_confidence: MEDIUM
            risk_level: MEDIUM
            validation_description: >
              Root-scoped and path-scoped slash commands affect only matching
              reconciliation and synchronization candidates.

      - title: Documentation Pipeline Integration
        description: >
          Integrate component documentation after deterministic synchronization
          so new and changed ComponentRegistry records receive current semantic
          descriptions without requiring Wu to orchestrate the process.
        status: PLANNED

        steps:

          - title: Inspect the current documentation command
            description: >
              Review document_workspace and its supporting services to identify
              accepted arguments, candidate-selection behavior, provider usage,
              mutation boundaries, and assumptions that remain valid.
            status: PLANNED
            estimated_minutes: 90
            estimate_confidence: MEDIUM
            risk_level: MEDIUM
            validation_description: >
              The current documentation pipeline is documented accurately
              before integration or modification begins.

          - title: Expose reusable documentation orchestration
            description: >
              Make component documentation callable through an application
              service without duplicating management-command implementation or
              embedding documentation procedures in the slash-command handler.
            status: PLANNED
            estimated_minutes: 180
            estimate_confidence: LOW
            risk_level: HIGH
            validation_description: >
              The management command and workspace slash command invoke the same
              authoritative documentation service.

          - title: Document only eligible registry records
            description: >
              Restrict AI-assisted documentation to new, stale, missing, or
              explicitly selected ComponentRegistry records after deterministic
              synchronization completes.
            status: PLANNED
            estimated_minutes: 150
            estimate_confidence: LOW
            risk_level: HIGH
            validation_description: >
              Current records are not unnecessarily regenerated, and every
              eligible new or changed record receives a visible documentation
              result or failure.

      - title: Registry Drift Recovery and Validation
        description: >
          Use the current ComponentRegistry drift as the end-to-end acceptance
          test for the automated workflow and leave the registry in a verified,
          maintainable state.
        status: PLANNED

        steps:

          - title: Reconcile current workspace drift
            description: >
              Run the read-only workflow against the current repository and
              confirm the reported KEEP, UPDATE, REGISTER, STAGE, EXCLUDE, and
              REVIEW classifications before applying changes.
            status: PLANNED
            estimated_minutes: 60
            estimate_confidence: HIGH
            risk_level: LOW
            validation_description: >
              The automated status operation reproduces the known reconciliation
              baseline of 137 KEEP, 11 UPDATE, 57 REGISTER, 16 STAGE, 13 EXCLUDE,
              and 0 REVIEW records unless repository changes have occurred.

          - title: Apply current registry synchronization
            description: >
              Update eligible existing records, register approved new records,
              synchronize graph projections, and report every successful,
              skipped, staged, excluded, or failed operation.
            status: PLANNED
            estimated_minutes: 180
            estimate_confidence: LOW
            risk_level: HIGH
            risk_description: >
              The repository contains substantial accumulated drift, so
              registration ownership, staged files, exclusions, PostgreSQL
              writes, and Neo4j projection must remain explicitly visible.
            validation_description: >
              All approved UPDATE and REGISTER candidates are processed without
              silent failures or unintended repository mutation.

          - title: Validate final registry health
            description: >
              Run component documentation for eligible records and perform a
              final deterministic reconciliation to verify that no unexplained
              workspace drift remains.
            status: PLANNED
            estimated_minutes: 180
            estimate_confidence: LOW
            risk_level: HIGH
            validation_description: >
              Final reconciliation reports no unexpected UPDATE, REGISTER, or
              REVIEW candidates, and every eligible synchronized component has
              current documentation or an explicit failure requiring review.

add_phases: []

add_steps: []

# ======================================================================
# END: WORKSPACE_REGISTRY_AUTOMATION_INITIATIVE
